<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Flow</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
</head>
<body>
    <div id="game-wrapper">
        <div id="header">
            <button id="menu-btn" onclick="openMenu()">☰</button>
            <h2>Level <span id="level-display">1</span></h2>
            <button id="settings-btn" onclick="openSettings()">⚙️</button>
        </div>
        
        <div id="game-container"></div>

        <div id="controls">
            <button id="undo-btn" onclick="undoMove()">
                ↶ <span class="badge" id="undo-count">5</span>
            </button>
            <button id="add-tube-btn" onclick="addTube()">
                🧪 <span class="badge" id="add-tube-count">2</span>
            </button>
        </div>
    </div>

    <!-- The Win Screen -->
    <div id="win-screen">
        <h1>AWESOME</h1>
        <p>Level Complete!</p>
        <button onclick="nextLevel()">Next</button>
    </div>

    <!-- The Menu / Level Select Screen -->
    <div id="menu-screen">
        <div id="menu-header">
            <div id="coin-display">🪙 <span id="coin-count">0</span></div>
            <h2 id="menu-title">Levels</h2>
            <button id="close-menu-btn" onclick="closeMenu()">✕</button>
        </div>
        
        <!-- ONLY 2 TABS NOW -->
        <div id="menu-tabs">
            <button id="tab-levels" class="tab active" onclick="showLevels()">🎯 Levels</button>
            <button id="tab-themes" class="tab" onclick="showThemes()">🖼️ Themes</button>
        </div>

        <!-- LEVELS CONTAINER -->
        <div id="levels-grid" style="display: grid;"></div>

        <!-- THEMES CONTAINER -->
        <div id="themes-grid" style="display: none;">
            <div class="shop-item">
                <div class="shop-preview" style="background: radial-gradient(circle at 50% 30%, #2a2a5a 0%, #1a1a2e 80%);"></div>
                <p>Space</p>
                <button class="buy-btn owned">Owned</button>
            </div>
            <div class="shop-item">
                <div class="shop-preview" style="background: radial-gradient(circle at 50% 30%, #2a5a2a 0%, #1a2e1a 80%);"></div>
                <p>Forest</p>
                <button class="buy-btn" onclick="buyTheme('forest', 500)">500 🪙</button>
            </div>
            <div class="shop-item">
                <div class="shop-preview" style="background: radial-gradient(circle at 50% 30%, #5a4a2a 0%, #2e1a1a 80%);"></div>
                <p>Desert</p>
                <button class="buy-btn" onclick="buyTheme('desert', 500)">500 🪙</button>
            </div>
            <div class="shop-item">
                <div class="shop-preview" style="background: linear-gradient(to top, #ff7e5f, #feb47b);"></div>
                <p>Sunset</p>
                <button class="buy-btn" onclick="watchAdForTheme('sunset')">📺 Watch Ad</button>
            </div>
            <div class="shop-item">
                <div class="shop-preview" style="background: radial-gradient(circle at 50% 50%, #ff0000 0%, #330000 100%);"></div>
                <p>Lava</p>
                <button class="buy-btn" onclick="watchAdForTheme('lava')">📺 Watch Ad</button>
            </div>
        </div>

        <div id="menu-footer">
            <button id="ad-reward-btn" onclick="watchAdForCoins()">📺 🪙 +150</button>
        </div>
    </div>

    <!-- Settings Screen -->
    <div id="settings-screen">
        <div id="settings-header">
            <h2>Settings</h2>
            <button onclick="closeSettings()">✕</button>
        </div>
        <div class="settings-list">
            <div class="setting-item">
                <span>Sound Effects</span>
                <button id="toggle-sound" class="toggle-btn" onclick="toggleSound()">ON</button>
            </div>
            <div class="setting-item">
                <span>Test Sound</span>
                <button class="toggle-btn" onclick="playTone(600, 0.2)">🔊 Play</button>
            </div>
        </div>
    </div>

    <!-- Out of Tools Modal -->
    <div id="out-of-tools-modal">
        <div class="modal-content">
            <h2 id="modal-title">Out of Undos! 😢</h2>
            <p id="modal-desc">Watch a short ad to get +3 Undos?</p>
            <button class="ad-btn" onclick="watchAdForUndos()">📺 Watch Ad</button>
            <button class="cancel-btn" onclick="closeOutOfTools()">Cancel</button>
        </div>
    </div>

    <!-- Fake Ad Overlay -->
    <div id="ad-overlay">
        <div class="ad-content">
            <h2>Advertisement</h2>
            <div class="ad-video-placeholder">
                <div class="spinner"></div>
                <p>Playing Ad...</p>
            </div>
            <div id="ad-timer">5</div>
            <button id="ad-close-btn" disabled>Skip</button>
        </div>
    </div>

    <script src="game.js?v=4"></script>
</body>
</html>
