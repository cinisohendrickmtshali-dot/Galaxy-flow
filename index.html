<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="header">
            <button id="menu-btn" onclick="openMenu()">☰</button>
            <h2>Level <span id="level-display">1</span></h2>
            <button id="restart-btn" onclick="restartLevel()">↻</button>
        </div>
        
        <div id="game-container"></div>

        <div id="controls">
            <button id="undo-btn" onclick="undoMove()">
                ↶ <span class="badge" id="undo-count">5</span>
            </button>
            <button id="add-tube-btn" onclick="addTube()">
                🧪 <span class="badge" id="add-tube-count">2</span>
            </button>
        </div>
    </div>

    <!-- The Win Screen -->
    <div id="win-screen">
        <h1>AWESOME</h1>
        <p>Level Complete!</p>
        <button onclick="nextLevel()">Next</button>
    </div>

    <!-- --- NEW MENU SCREEN --- -->
    <div id="menu-screen">
        <div id="menu-header">
            <div id="coin-display">🪙 <span id="coin-count">0</span></div>
            <h2>Themes</h2>
            <button id="close-menu-btn" onclick="closeMenu()">✕</button>
        </div>
        
        <div id="menu-tabs">
            <button class="tab active">🔬 Tubes</button>
            <button class="tab">🖼️ Themes</button>
            <button class="tab">⚪ Balls</button>
            <button class="tab">⬜ Shapes</button>
        </div>

        <div id="level-grid">
            <!-- Level cards will be generated here -->
        </div>

        <div id="menu-footer">
            <button id="ad-reward-btn">📺 🪙 +150</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
