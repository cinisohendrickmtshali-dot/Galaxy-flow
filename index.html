<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Flow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="header">
            <h2>Level <span id="level-display">1</span></h2>
            <button id="restart-btn" onclick="restartLevel()">↻</button>
        </div>
        
        <div id="game-container">
            <!-- Tubes will be generated here -->
        </div>

        <div id="controls">
            <button id="undo-btn" onclick="undoMove()">
                ↶ <span class="badge" id="undo-count">5</span>
            </button>
            <button id="add-tube-btn" onclick="addTube()">
                🧪 <span class="badge" id="add-tube-count">2</span>
            </button>
        </div>
    </div>

    <!-- The Win Screen (Hidden by default) -->
    <div id="win-screen">
        <h1>AWESOME</h1>
        <p>Level Complete!</p>
        <button onclick="nextLevel()">Next</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
